<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Cards Preview — Uday Sai Setti</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }
    .row-3 > * {
      width: 32.5%;
    }
    .row-2 > * {
      width: 49%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
    a {
      display: block;
      text-decoration: none;
    }
    .header {
      margin-bottom: 24px;
      text-align: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 500;
      color: #8b949e;
      margin: 0 0 8px 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: #1f242c;
      font-size: 13px;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GitHub Profile Live Preview</h1>
    <span class="badge">Matches GitHub README Layout</span>
  </div>

  <div class="container">
    <a href="https://github.com/udaysai12"><img src="cards/hero.svg" alt="Hero Card" /></a>
    <img src="cards/graph.svg" alt="Contribution Graph" />
    <img src="cards/months.svg" alt="Monthly Contributions" />

    <div class="row row-3">
      <a href="https://github.com/udaysai12?tab=repositories"><img src="cards/build.svg" alt="Build" /></a>
      <a href="https://github.com/udaysai12?tab=repositories"><img src="cards/ship.svg" alt="Ship" /></a>
      <a href="https://www.linkedin.com/in/uday-sai-setti-a24332275/"><img src="cards/lead.svg" alt="Lead" /></a>
    </div>

    <div class="row row-2">
      <a href="https://github.com/udaysai12/pcdrop"><img src="cards/repo-1.svg" alt="PCDrop" /></a>
      <a href="https://github.com/udaysai12"><img src="cards/repo-2.svg" alt="Errand LearnHub" /></a>
    </div>

    <div class="row row-2">
      <a href="https://github.com/udaysai12"><img src="cards/repo-3.svg" alt="WayM8" /></a>
      <a href="https://github.com/udaysai12"><img src="cards/repo-4.svg" alt="TIE" /></a>
    </div>
  </div>
</body>
</html>
